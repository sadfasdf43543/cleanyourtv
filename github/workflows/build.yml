# Replace the content of  .github/workflows/build.yml  in your fork with this file.
name: Build launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    # pinned: "ubuntu-latest" is moving to Ubuntu 26 and its Android SDK / JDK may differ
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Look around (for the log)
        run: |
          set -x
          pwd
          ls -la
          ls -la launcher
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/cmdline-tools" || true

      - name: Install Android SDK platform 34 and build-tools 34
        run: |
          set -euxo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build the launcher
        working-directory: launcher
        run: |
          set -euxo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-launcher
          path: launcher/app/build/outputs/apk/release/*.apk
