plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvremote.prayer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvremote.prayer'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
